<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FestPass 2026</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #172033; }
    #status { padding: .75rem; border-radius: .5rem; background: #eef2ff; }
    form { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
    input, select, button { padding: .65rem; font: inherit; }
    input { flex: 1 1 12rem; }
    button { border: 0; border-radius: .4rem; background: #4338ca; color: white; cursor: pointer; }
    li { padding: .35rem 0; }
  </style>
</head>
<body>
  <h1>FestPass 2026 registrations</h1>
  <p id="status" role="status">Checking the backend...</p>
  <form id="form">
    <input id="name" placeholder="Your name" autocomplete="name" required>
    <select id="event" aria-label="Event">
      <option>Hackathon</option>
      <option>Robo Race</option>
      <option>Tech Quiz</option>
    </select>
    <button>Register</button>
  </form>
  <ul id="list"></ul>
  <script>
    const api = (path, options) => fetch("/api/" + path, options).then(async response => {
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || "Request failed");
      return body;
    });

    async function refresh() {
      const status = document.getElementById("status");
      try {
        const health = await api("health");
        status.textContent = `REGNO ${health.regno} | backend ${health.version} on ${health.container} | database ${health.database ? "connected" : "not connected"}`;
        const rows = await api("registrations");
        document.getElementById("list").replaceChildren(...rows.map(row => {
          const item = document.createElement("li");
          item.textContent = `#${row.id} ${row.name} (${row.event})`;
          return item;
        }));
      } catch (_err) {
        status.textContent = "Backend not reachable";
      }
    }

    document.getElementById("form").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await api("registrations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            event: document.getElementById("event").value,
          }),
        });
        document.getElementById("name").value = "";
        await refresh();
      } catch (error) {
        document.getElementById("status").textContent = error.message;
      }
    });

    refresh();
  </script>
</body>
</html>
