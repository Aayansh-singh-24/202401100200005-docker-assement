services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - data
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER in .env}/fest-backend:1.0.0
    environment:
      REGNO: ${REGNO:?Set REGNO in .env}
      APP_VERSION: 1.0.0
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - data
    restart: unless-stopped

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT:?Set PORT in .env}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - web
    restart: unless-stopped

networks:
  web:
  data:

volumes:
  postgres-data:


